; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
  ; https://docs.platformio.org/page/projectconf.html

; Two environments:
;   esp32dev  - local build / USB upload. Uses include/private_data.h as
;               fallback device string, if the file exists.
;   installer - release build for the Web Installer (installer/firmware/).
;               Ignores private_data.h, so no personal string is published.
;               See FIRMWARE.md for the release process.

; VERSION FORMAT: v<BITCOIN_BLOCK_HEIGHT>
; Get current block height from: https://mempool.space/api/blocks/tip/height
; Current version: v977405

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	zinggjm/GxEPD2@^1.5.2
	ricmoo/QRCode@^0.0.1
	stepansnigirev/uBitcoin@^0.2.0
	DFRobot/DFRobotDFPlayerMini@1.0.6

[env:esp32dev]
build_flags =
	-DFIRMWARE_VERSION=\"dev\"

[env:installer]
build_flags =
	-DINSTALLER_BUILD=1
	-DFIRMWARE_VERSION=\"v977405\"
