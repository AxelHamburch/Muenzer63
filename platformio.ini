; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
  ; https://docs.platformio.org/page/projectconf.html

; The same build is used for USB upload and for Web Installer releases
; (installer/firmware/), see FIRMWARE.md. The device string is not part of the
; firmware, it is entered with the Web Installer.

; VERSION FORMAT: v<BITCOIN_BLOCK_HEIGHT>
; Get current block height from: https://mempool.space/api/blocks/tip/height
; Current version: v977544

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	zinggjm/GxEPD2@^1.5.2
	ricmoo/QRCode@^0.0.1
	stepansnigirev/uBitcoin@^0.2.0
	DFRobot/DFRobotDFPlayerMini@1.0.6
build_flags =
	-DFIRMWARE_VERSION=\"v977544\"
